name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
      - name: Start production app
        run: cp -R public .next/standalone/public && mkdir -p .next/standalone/.next && cp -R .next/static .next/standalone/.next/static && node .next/standalone/server.js > /tmp/keepme-server.log 2>&1 &
        env:
          PORT: 3000
          HOSTNAME: 127.0.0.1
      - run: npm run smoke:guided
      - run: npm run audit:a11y

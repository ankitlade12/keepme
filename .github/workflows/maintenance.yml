name: session expiry maintenance

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepme-maintenance
  cancel-in-progress: false

jobs:
  cleanup:
    if: ${{ vars.KEEPME_MAINTENANCE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run verified session cleanup
        env:
          CRON_SECRET: ${{ secrets.KEEPME_CRON_SECRET }}
          MAINTENANCE_URL: ${{ vars.KEEPME_MAINTENANCE_URL }}
        run: |
          test -n "$CRON_SECRET"
          test -n "$MAINTENANCE_URL"
          curl --fail --silent --show-error --retry 2 --max-time 60 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "${MAINTENANCE_URL%/}/api/internal/maintenance"
